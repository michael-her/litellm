model_list:
  - model_name: claude-default
    litellm_params:
      model: claude_code/claude-opus-5-5
  - model_name: claude-fable-5-1
    litellm_params:
      model: claude_code/claude-fable-5-1
  - model_name: claude-opus-5-5
    litellm_params:
      model: claude_code/claude-opus-5-5
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: claude_code/claude-sonnet-5-5
  - model_name: claude-haiku-5-5
    litellm_params:
      model: claude_code/claude-haiku-5-5

litellm_settings:
  drop_params: true
  num_retries: 0
  request_timeout: 660
  custom_provider_map:
    - provider: claude_code
      custom_handler: claude_llm.claude_code_handler

router_settings:
  disable_cooldowns: true

general_settings:
  global_max_parallel_requests: 1
  master_key: os.environ/CLAUDE_PROXY_KEY
